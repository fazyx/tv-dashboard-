<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart TV Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: 'Segoe UI', Roboto, Helvetica, sans-serif;
      color: #ffffff;
      background-color: #0f172a;
      user-select: none;
      cursor: none;
    }
    body {
      background: url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1920&q=85') no-repeat center center/cover;
      display: grid;
      grid-template-columns: 1.15fr 1fr;
      grid-template-rows: minmax(0, 1.25fr) minmax(0, 1fr);
      gap: 2.5vh 2vw;
      padding: 3vh 3vw;
    }
    .overlay {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, rgba(15,23,42,0.75) 0%, rgba(15,23,42,0.45) 100%);
      z-index: 0;
    }
    .card {
      position: relative;
      z-index: 1;
      min-height: 0;
      background: rgba(15, 23, 42, 0.60);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 2.2vh;
      padding: 3vh 2.5vw;
      box-shadow: 0 1vh 3vh rgba(0, 0, 0, 0.35);
    }
    /* Bloc Heure & Date */
    .clock-panel {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    #time {
      font-size: 13vh;
      font-weight: 700;
      letter-spacing: -0.3vw;
      line-height: 1;
    }
    #date {
      font-size: 3.4vh;
      color: #cbd5e1;
      margin-top: 1.8vh;
      text-transform: capitalize;
    }
    /* Bloc Météo */
    .weather-panel {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .weather-current {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .temp-main {
      font-size: 8.5vh;
      font-weight: 700;
      line-height: 1;
    }
    .city-name {
      font-size: 3.2vh;
      color: #94a3b8;
      font-weight: 600;
    }
    .weather-desc {
      font-size: 2.5vh;
      color: #e2e8f0;
      margin-top: 0.6vh;
    }
    .forecast-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1vw;
      border-top: 1px solid rgba(255,255,255,0.12);
      padding-top: 2vh;
      text-align: center;
    }
    .forecast-day {
      background: rgba(255,255,255,0.06);
      padding: 1.4vh 0.6vw;
      border-radius: 1.4vh;
    }
    .forecast-day .day-label {
      font-size: 2.1vh;
      color: #cbd5e1;
      font-weight: 600;
      text-transform: capitalize;
    }
    .forecast-day .day-temp {
      font-size: 2.3vh;
      margin-top: 0.6vh;
      font-weight: 700;
    }
    /* Bloc Emploi du temps du jour */
    .schedule-panel {
      grid-column: 1 / -1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 1.8vh;
    }
    .schedule-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 2.2vh;
      text-transform: uppercase;
      letter-spacing: 0.15vw;
      color: #38bdf8;
      font-weight: 700;
      flex-shrink: 0;
    }
    .schedule-count {
      font-size: 1.9vh;
      color: #94a3b8;
      text-transform: none;
      letter-spacing: 0;
      font-weight: 500;
    }
    .schedule-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(18vw, 1fr));
      gap: 1.5vw;
      flex: 1;
      min-height: 0;
    }
    .event-card {
      background: rgba(255, 255, 255, 0.06);
      padding: 2vh 1.5vw;
      border-radius: 1.6vh;
      border-left: 0.4vw solid #38bdf8;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 0;
    }
    .event-card.ongoing {
      background: rgba(56, 189, 248, 0.16);
      border-left-color: #22c55e;
    }
    .event-card.past {
      opacity: 0.5;
      border-left-color: #64748b;
    }
    .event-time {
      font-size: 2.1vh;
      font-weight: 700;
      color: #38bdf8;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .event-card.ongoing .event-time {
      color: #4ade80;
    }
    .badge-live {
      font-size: 1.5vh;
      background: #22c55e;
      color: #0f172a;
      padding: 0.3vh 0.6vw;
      border-radius: 0.8vh;
      font-weight: 700;
      text-transform: uppercase;
    }
    .event-title {
      font-size: 2.4vh;
      font-weight: 700;
      line-height: 1.3;
      margin: 1vh 0;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .event-location {
      font-size: 1.9vh;
      color: #cbd5e1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .empty-schedule {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.04);
      border-radius: 1.6vh;
      font-size: 2.5vh;
      color: #cbd5e1;
      height: 100%;
    }
  </style>
</head>
<body>
  <div class="overlay"></div>

  <!-- Gauche : Heure & Date -->
  <div class="card clock-panel">
    <div id="time">--:--</div>
    <div id="date">Chargement...</div>
  </div>

  <!-- Droite : Météo Actuelle + Prévisions 4 jours -->
  <div class="card weather-panel">
    <div class="weather-current">
      <div>
        <div class="city-name" id="city">Strasbourg</div>
        <div class="weather-desc" id="weather-desc">Chargement météo...</div>
      </div>
      <div class="temp-main" id="temp">--°C</div>
    </div>
    <div class="forecast-grid" id="forecast"></div>
  </div>

  <!-- Bas : Emploi du temps du jour -->
  <div class="card schedule-panel">
    <div class="schedule-header">
      <span>Emploi du temps du jour</span>
      <span class="schedule-count" id="schedule-summary">Chargement...</span>
    </div>
    <div class="schedule-grid" id="schedule-container"></div>
  </div>

  <script>
    // 1. CONFIGURATION
    const CONFIG = {
      city: "Strasbourg",
      lat: 48.5734,
      lon: 7.7521,
      // Collez ci-dessous votre lien .ics (ADE Campus / ENT ou Google Agenda) :
      icsUrl: "COLLEZ_VOTRE_LIEN_ICS_ICI"
    };

    // 2. HORLOGE TEMPS RÉEL
    function updateClock() {
      const now = new Date();
      document.getElementById('time').textContent = now.toLocaleTimeString('fr-FR', {
        hour: '2-digit', minute: '2-digit'
      });
      document.getElementById('date').textContent = now.toLocaleDateString('fr-FR', {
        weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
      });
    }
    setInterval(updateClock, 1000);
    updateClock();

    // 3. MÉTÉO (Open-Meteo)
    const WMO_CODES = {
      0: "Ciel dégagé ☀️", 1: "Peu nuageux 🌤️", 2: "Partiellement nuageux ⛅",
      3: "Couvert ☁️", 45: "Brouillard 🌫️", 51: "Bruine légère 🌦️",
      61: "Pluie faible 🌧️", 63: "Pluie modérée 🌧️", 65: "Pluie forte 🌧️",
      71: "Neige ❄️", 80: "Averses 🌦️", 95: "Orage ⛈️"
    };

    async function fetchWeather() {
      try {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${CONFIG.lat}&longitude=${CONFIG.lon}&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=Europe%2FParis`;
        const res = await fetch(url);
        const data = await res.json();

        document.getElementById('city').textContent = CONFIG.city;
        document.getElementById('temp').textContent = `${Math.round(data.current.temperature_2m)}°C`;
        document.getElementById('weather-desc').textContent = WMO_CODES[data.current.weather_code] || "Variable";

        const forecastEl = document.getElementById('forecast');
        forecastEl.innerHTML = '';
        for (let i = 1; i <= 4; i++) {
          const dateObj = new Date(data.daily.time[i]);
          const dayName = dateObj.toLocaleDateString('fr-FR', { weekday: 'short' });
          const min = Math.round(data.daily.temperature_2m_min[i]);
          const max = Math.round(data.daily.temperature_2m_max[i]);
          forecastEl.innerHTML += `
            <div class="forecast-day">
              <div class="day-label">${dayName}</div>
              <div class="day-temp">${min}° / ${max}°C</div>
            </div>`;
        }
      } catch (e) {
        console.error("Erreur météo:", e);
      }
    }
    fetchWeather();
    setInterval(fetchWeather, 15 * 60 * 1000);

    // 4. EMPLOI DU TEMPS DU JOUR (Lecteur .ICS intégré)
    function parseIcsDate(raw) {
      if (!raw) return null;
      const clean = raw.trim();
      if (clean.length === 8) {
        return new Date(
          parseInt(clean.slice(0, 4)),
          parseInt(clean.slice(4, 6)) - 1,
          parseInt(clean.slice(6, 8)), 0, 0, 0
        );
      }
      const y = parseInt(clean.slice(0, 4));
      const m = parseInt(clean.slice(4, 6)) - 1;
      const d = parseInt(clean.slice(6, 8));
      const hh = parseInt(clean.slice(9, 11)) || 0;
      const mm = parseInt(clean.slice(11, 13)) || 0;
      const ss = parseInt(clean.slice(13, 15)) || 0;
      if (clean.endsWith('Z')) {
        return new Date(Date.UTC(y, m, d, hh, mm, ss));
      }
      return new Date(y, m, d, hh, mm, ss);
    }

    function cleanIcsText(txt) {
      if (!txt) return "";
      return txt.replace(/\\n/gi, ' ').replace(/\\,/g, ',').replace(/\\;/g, ';').trim();
    }

    async function fetchTextWithFallback(targetUrl) {
      const proxies = [
        `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`,
        `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`
      ];
      for (const p of proxies) {
        try {
          const r = await fetch(p);
          if (r.ok) return await r.text();
        } catch (err) {}
      }
      throw new Error("Impossible de charger le flux ICS");
    }

    async function fetchSchedule() {
      const container = document.getElementById('schedule-container');
      const summaryEl = document.getElementById('schedule-summary');

      if (!CONFIG.icsUrl || CONFIG.icsUrl === "COLLEZ_VOTRE_LIEN_ICS_ICI") {
        summaryEl.textContent = "Configuration requise";
        container.innerHTML = `<div class="empty-schedule">Ajoutez votre lien .ics dans la variable CONFIG.icsUrl du fichier index.html</div>`;
        return;
      }

      try {
        const rawIcs = await fetchTextWithFallback(CONFIG.icsUrl);
        const unfolded = rawIcs.replace(/\r?\n[ \t]/g, '');
        const blocks = unfolded.split('BEGIN:VEVENT').slice(1);

        const now = new Date();
        const todayKey = now.toLocaleDateString('fr-CA'); // YYYY-MM-DD local

        const todaysEvents = [];

        for (const block of blocks) {
          const endBlock = block.split('END:VEVENT')[0];
          const dtStartMatch = endBlock.match(/DTSTART(?:;[^:]*)?:([^\r\n]+)/);
          const dtEndMatch = endBlock.match(/DTEND(?:;[^:]*)?:([^\r\n]+)/);
          const summaryMatch = endBlock.match(/SUMMARY(?:;[^:]*)?:([^\r\n]+)/);
          const locationMatch = endBlock.match(/LOCATION(?:;[^:]*)?:([^\r\n]+)/);

          if (!dtStartMatch) continue;
          const startDate = parseIcsDate(dtStartMatch[1]);
          const endDate = dtEndMatch ? parseIcsDate(dtEndMatch[1]) : startDate;

          if (!startDate) continue;
          const eventDayKey = startDate.toLocaleDateString('fr-CA');

          if (eventDayKey === todayKey) {
            todaysEvents.push({
              start: startDate,
              end: endDate,
              title: cleanIcsText(summaryMatch ? summaryMatch[1] : "Événement"),
              location: cleanIcsText(locationMatch ? locationMatch[1] : "")
            });
          }
        }

        todaysEvents.sort((a, b) => a.start - b.start);

        if (todaysEvents.length === 0) {
          summaryEl.textContent = "Aucun événement aujourd'hui";
          container.innerHTML = `<div class="empty-schedule">Aucun cours ou rendez-vous prévu pour aujourd'hui 🎉</div>`;
          return;
        }

        summaryEl.textContent = `${todaysEvents.length} créneau${todaysEvents.length === 1 ? '' : 'x'} aujourd'hui`;
        container.innerHTML = '';

        todaysEvents.slice(0, 4).forEach(ev => {
          const startStr = ev.start.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
          const endStr = ev.end.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
          const isOngoing = now >= ev.start && now <= ev.end;
          const isPast = now > ev.end;

          const statusClass = isOngoing ? 'ongoing' : (isPast ? 'past' : '');
          const liveBadge = isOngoing ? `<span class="badge-live">En cours</span>` : '';

          container.innerHTML += `
            <div class="event-card ${statusClass}">
              <div class="event-time">
                <span>${startStr} - ${endStr}</span>
                ${liveBadge}
              </div>
              <div class="event-title">${ev.title}</div>
              <div class="event-location">${ev.location ? '📍 ' + ev.location : '&nbsp;'}</div>
            </div>`;
        });
      } catch (e) {
        console.error("Erreur emploi du temps:", e);
        summaryEl.textContent = "Erreur de synchronisation";
        container.innerHTML = `<div class="empty-schedule">Impossible de récupérer le calendrier (.ics)</div>`;
      }
    }

    fetchSchedule();
    setInterval(fetchSchedule, 5 * 60 * 1000); // Actualise toutes les 5 min
  </script>
</body>
</html>
